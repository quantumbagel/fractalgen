# Output size presets. `tags` is the default recipe selection when no names
# or --tag filters are given; `jobs` the default worker count, `max_jobs` a
# hard memory cap (16 GB machine: at most two live recipes, one at 16K).

[preset."4k"]
description = "16:9 desktop"
width = 3840
height = 2160
jobs = 1
max_jobs = 2
aliases = ["desktop-4k"]

[preset."8k"]
description = "16:9 desktop"
width = 7680
height = 4320
jobs = 2
max_jobs = 2
tags = ["keep"]
aliases = ["desktop-8k"]

