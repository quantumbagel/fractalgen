[recipe.flame_julia_veil]
description = "Hand-built flame: julia, spherical and swirl transforms"
generator = "flame"
palette = "aurora"
tags = ["keep"]

[recipe.flame_julia_veil.params]
symmetry = 2
color_speed = 0.4
xforms = [
  { affine = [0.56, -0.31, 0.31, 0.56, 0.12, 0.2], weight = 1.0, color = 0.0, variations = { julia = 1.0 } },
  { affine = [0.7, 0.45, -0.45, 0.7, -0.4, 0.1], weight = 0.6, color = 0.6, variations = { spherical = 0.7, linear = 0.3 } },
  { affine = [0.3, 0.0, 0.0, 0.3, 0.8, -0.5], weight = 0.25, color = 1.0, variations = { swirl = 1.0 } },
]
