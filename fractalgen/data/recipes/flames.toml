# Fractal flames. `fractalgen generators flame` lists parameters; an empty
# `xforms` draws random transforms from `seed`.

[recipe.flame_bloom]
description = "Three-fold fractal flame petals in twilight rose"
generator = "flame"
palette = "twilight"
tags = ["keep"]
params = { seed = 21, symmetry = 3, percentiles = [0.5, 99.5] }

[recipe.flame_starburst]
description = "Fractal flame starburst in neon ink"
