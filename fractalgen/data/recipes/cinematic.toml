# Cinematic simulations and raymarchers. `fractalgen generators` lists parameters.

[recipe.kerr_einstein_rings]
description = "Spinning black hole: lensed accretion disk, photon ring, Doppler beaming"
generator = "kerr_black_hole"
tags = ["keep", "vip"]

[recipe.kerr_einstein_rings.variants.above]   # looking down onto the disk
params = { camera_elevation = 32.0, camera_distance = 58.0, roll = -14.0, fov = 28.0, disk_outer = 14.0, exposure = -0.7, temperature = 3800.0 }

[recipe.kerr_einstein_rings.variants.white_hot]   # hotter, bluer gas, stronger beaming
params = { temperature = 16000.0, doppler = 0.8, turbulence = 0.85, saturation = 1.8, exposure = -0.3 }

