# Vector flows, cymatics, Chladni, Worley.

[vectorfield.silk]
description = "flowing silk streamlines"
vx = "sin(1.6 * py + 0.4 * sin(2.3 * px)) + 0.42 * sin(3.1 * px + 1.2 * py) + 0.28 * sin(5.1 * py - 1.7 * px) + 0.16 * cos(2.4 * px * py)"
vy = "cos(1.4 * px - 0.3 * sin(2.0 * py)) + 0.42 * cos(2.7 * py - 0.8 * px) + 0.28 * cos(4.6 * px + 1.4 * py) + 0.16 * sin(3.3 * px - 2.1 * py)"

[vectorfield.swirl]
description = "curl-like swirls"
vx = "sin(px * py) + cos(1.7 * py)"
vy = "cos(px * px - py) * 0.7 + sin(1.3 * px)"

[recipe.flow_swirl]
generator = "flow_field"
palette = "cosmic"
tags = ["draft"]
params = { field = "swirl", particles = 100000, particles_cap = 380000, steps = 320, seed = 12, wrap = true }

[recipe.flow_silk_open]
generator = "flow_field"
