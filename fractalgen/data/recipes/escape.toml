# Escape-time fractals. `fractalgen generators escape_time` lists every parameter.
# Complex numbers are [re, im] (or strings like "-0.8+0.156j").

[formula.sine_julia]
z = "c * sin(z)"
julia = true
bailout = 50.0
degree = 1.0
description = "c sin(z), pixel is z0"

[recipe.mandelbrot_cosmic]
description = "The full Mandelbrot set in deep-space violet and gold"
generator = "escape_time"
palette = "cosmic"
tags = ["keep", "vip"]
view = { center = [-0.55, 0], half_width = 1.85 }
params = { formula = "mandelbrot", max_iter = 420 }
portrait.view = { center = [-0.62, 0.0], half_width = 0.92, fit = "fill" }

