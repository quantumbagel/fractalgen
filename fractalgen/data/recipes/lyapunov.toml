# Lyapunov views: center = [a, b], and fit = "cover" makes b span center ± half_width / (16/9)
# at every aspect. Zoom like any other plane.

[recipe.lyapunov_logistic]   # generator default view: a, b around 3.4..4.0
generator = "lyapunov"
palette = "icefire"
tags = ["keep"]
portrait.view = { center = [3.772, 3.7] }

[recipe.lyapunov_ab]   # b spans 2..4
generator = "lyapunov"
palette = "icefire"
tags = ["keep", "vip"]
view = { center = [3.0, 3.0], half_width = 1.7777777777777777, fit = "cover" }
params = { sequence = "AB" }
portrait.view = { center = [3.24, 3.0] }

[recipe.lyapunov_baba]   # b spans 3..4
generator = "lyapunov"
palette = "icefire"
tags = ["keep", "vip"]
view = { center = [3.5, 3.5], half_width = 0.8888888888888888, fit = "cover" }
params = { sequence = "BABA" }
portrait.view = { center = [3.62, 3.5] }

[recipe.lyapunov_aurum]   # b spans 2.9..3.7
description = "Lyapunov AAAAAABBBBBB in teal glass and molten gold"
generator = "lyapunov"
palette = ["02040c", "0a3a4a", "3ee0c8", "eafff8", "ffd166", "c2185b", "2a0b3e"]
tags = ["keep", "vip"]
view = { center = [3.3, 3.3], half_width = 0.7, fit = "cover" }
params = { sequence = "AAAAAABBBBBB" }
