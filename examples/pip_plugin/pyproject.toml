[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalgen-pip-demo"
version = "0.0.1"
description = "Minimal fractalgen.plugins entry-point example (not published)"
requires-python = ">=3.11"
dependencies = ["fractalgen"]

[project.entry-points."fractalgen.plugins"]
demo = "fractalgen_pip_demo:register"

[tool.setuptools.packages.find]
where = ["src"]
