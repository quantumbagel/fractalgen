[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalgen"
version = "0.1.0"
description = "Extensible math / fractal wallpaper generator"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "quantumbagel"}]
requires-python = ">=3.11"
keywords = [
    "fractal",
    "wallpaper",
    "mandelbrot",
    "julia",
    "generative-art",
    "procedural",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=2.0", "pillow>=11.0", "scipy>=1.14", "numba>=0.61"]

[project.scripts]
fractalgen = "fractalgen.cli:main"

# Third-party packages register hooks here, e.g.:
# [project.entry-points."fractalgen.plugins"]
# my_fractals = "my_fractals:register"
[project.entry-points."fractalgen.plugins"]

[tool.setuptools.packages.find]
include = ["fractalgen*"]

[tool.setuptools.package-data]
fractalgen = ["data/*.toml", "data/recipes/*.toml", "gui/static/*"]
